spring.application.name=smart-transit
server.port=${SERVER_PORT:8080}

# --- Database (credentials come from the environment, never from this file) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_transit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# --- Kinvia ---
kinvia.zone=Asia/Kolkata
kinvia.security.token-secret=${KINVIA_TOKEN_SECRET:}
kinvia.security.token-ttl=12h
kinvia.security.pbkdf2-iterations=600000
kinvia.cors.allowed-origins=${KINVIA_CORS_ORIGINS:http://localhost:5173}
kinvia.booking.hold-duration=10m
kinvia.booking.max-passengers=6
kinvia.trips.horizon-days=30
kinvia.trips.history-days=3
kinvia.journey.max-transfers=2
kinvia.journey.max-wait=8h
kinvia.journey.max-results=30
kinvia.payment.provider=development
kinvia.tracking.provider=simulated
kinvia.seed.enabled=${KINVIA_SEED:true}
kinvia.seed.password=${KINVIA_SEED_PASSWORD:Kinvia@Dev1}
kinvia.timetable.import-enabled=${KINVIA_TIMETABLE_IMPORT:true}

logging.level.org.hibernate.orm.deprecation=warn
